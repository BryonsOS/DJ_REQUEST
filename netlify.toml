# Netlify deploys straight from the repo root — no build step.
[build]
  publish = "."

# Site root serves the app, so the QR / bare URL works (and #booth on top of it).
[[redirects]]
  from   = "/"
  to     = "/request-portal.html"
  status = 200

# Repo files that shouldn't be public on the site.
[[redirects]]
  from   = "/README.md"
  to     = "/404"
  status = 404
  force  = true
[[redirects]]
  from   = "/CLAUDE.md"
  to     = "/404"
  status = 404
  force  = true
[[redirects]]
  from   = "/supabase/*"
  to     = "/404"
  status = 404
  force  = true
[[redirects]]
  from   = "/netlify.toml"
  to     = "/404"
  status = 404
  force  = true
[[redirects]]
  from   = "/.gitignore"
  to     = "/404"
  status = 404
  force  = true
